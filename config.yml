backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: "fa"

collections:
  - name: "settings"
    label: "محتوای سایت"
    files:
      - name: "site"
        label: "همه محتوا"
        file: "data/site.json"
        fields:
          - label: "هیرو (صفحه اول)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "لیبل بالا", name: "label", widget: "string" }
              - { label: "اسم", name: "name", widget: "string" }
              - { label: "جمله اصلی", name: "quote", widget: "string" }

          - label: "بخش درباره من"
            name: "about"
            widget: "object"
            fields:
              - { label: "عنوان بخش", name: "sectionTitle", widget: "string" }
              - label: "کارت‌ها"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "لیبل", name: "label", widget: "string" }
                  - { label: "عنوان", name: "title", widget: "string" }
                  - { label: "متن", name: "text", widget: "text" }

          - label: "نقل قول وسط صفحه"
            name: "quote"
            widget: "object"
            fields:
              - { label: "متن نقل قول", name: "text", widget: "text" }

          - label: "بخش حرف‌ها / افکار"
            name: "thoughts"
            widget: "object"
            fields:
              - { label: "عنوان بخش", name: "sectionTitle", widget: "string" }
              - { label: "عنوان کارت", name: "title", widget: "string" }
              - { label: "متن", name: "text", widget: "text" }

          - label: "بخش موسیقی"
            name: "music"
            widget: "object"
            fields:
              - { label: "عنوان بخش", name: "sectionTitle", widget: "string" }
              - { label: "عنوان معرفی", name: "introTitle", widget: "string" }
              - { label: "متن معرفی", name: "introText", widget: "text" }
              - label: "لیست آرتیست‌ها"
                name: "items"
                widget: "list"
                fields:
                  - { label: "اسم", name: "name", widget: "string" }
                  - { label: "توضیح کوتاه", name: "note", widget: "string" }

          - label: "بخش کتاب‌ها"
            name: "books"
            widget: "object"
            fields:
              - { label: "عنوان بخش", name: "sectionTitle", widget: "string" }
              - { label: "عنوان کارت کناری", name: "sideTitle", widget: "string" }
              - { label: "متن کارت کناری", name: "sideText", widget: "text" }
              - label: "لیست کتاب‌ها"
                name: "items"
                widget: "list"
                fields:
                  - { label: "اسم کتاب", name: "name", widget: "string" }
                  - { label: "توضیح کوتاه", name: "note", widget: "string" }

          - label: "فوتر"
            name: "footer"
            widget: "object"
            fields:
              - { label: "متن فوتر", name: "text", widget: "string" }
